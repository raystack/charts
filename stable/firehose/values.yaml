replicaCount: 1

## Value to fully override firehose.name template
nameOverride: ""
## Value to fully override firehose.fullname template
fullnameOverride: ""

labels: { "application": "firehose" }

firehose:
  image:
    repository: gotocompany/firehose
    pullPolicy: IfNotPresent
    tag: 1.1.0
  config:
    SOURCE_KAFKA_BROKERS: 127.0.0.1:6667
    SOURCE_KAFKA_CONSUMER_GROUP_ID: kafka-consumer-group-id
    SOURCE_KAFKA_TOPIC: sample-topic
    SINK_TYPE: log
    SOURCE_KAFKA_CONSUMER_CONFIG_AUTO_OFFSET_RESET: latest
    INPUT_SCHEMA_PROTO_CLASS: com.github.firehose.sampleLogProto.SampleLogMessage
    JAVA_TOOL_OPTIONS: "-javaagent:jolokia-jvm-agent.jar=port=8778,host=localhost"
    METRIC_STATSD_HOST: localhost
    METRIC_STATSD_PORT: "8125"
  args:
    [
      "java",
      "-cp",
      "bin/*:/work-dir/*",
      "com.gotocompany.firehose.launch.Main",
      "-server",
      "-Dlogback.configurationFile=etc/firehose/logback.xml",
      "-Xloggc:/var/log/firehose",
    ]
  resources:
    limits:
      cpu: 200m
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 512Mi

# Pod topology spread constraints, rendered as given. The chart adds the
# labelSelector (this release's pods) and matchLabelKeys (pod-template-hash, so each ReplicaSet spreads on its own).
# nodeTaintsPolicy defaults to Honor. Empty keeps the manifest unchanged.
# Example:
#   - maxSkew: 1
#     topologyKey: topology.kubernetes.io/zone
#     whenUnsatisfiable: DoNotSchedule
#   - maxSkew: 1
#     topologyKey: kubernetes.io/hostname
#     whenUnsatisfiable: ScheduleAnyway
topologySpreadConstraints: []

tolerations: []

nodeAffinityMatchExpressions:
  requiredDuringSchedulingIgnoredDuringExecution: []
  preferredDuringSchedulingIgnoredDuringExecution: []

init-firehose:
  enabled: false
  image:
    repository: busybox
    pullPolicy: IfNotPresent
    tag: latest
  command: ["/bin/sh", "-c"]
  args: [wget -O /work-dir/protos.jar http://proto_jar_url.jar]

telegraf:
  enabled: false
  image:
    repository: telegraf
    pullPolicy: IfNotPresent
    tag: 1.18.0-alpine
  config:
    additional_global_tags:
      team: some-team
      environment: testing
    output:
      influxdb:
        enabled: false
        urls:
          - "http://localhost:8086"
        database: "test-db"
        retention_policy: "autogen"
      prometheus_remote_write:
        enabled: false
        url: "http://localhost:8088"
        version: "0.1.0"
        # authorization: Bearer <token>
  resources:
    limits:
      cpu: 600m
      memory: 200Mi
    requests:
      cpu: 50m
      memory: 100Mi

envSecrets: {}
mountSecrets: []

# Service account the pod runs as. For an ACL (SASL/SSL) kafka source this is the
# identity the projected kafka token is minted against. Empty keeps the default.
service_account: ""

# ACL (SASL/SSL) kafka source support. Populated by Entropy from the stream's
# security profile; empty by default so plaintext firehoses render unchanged.
# All fields reference secrets that must already exist in the namespace.
kafka_security: {}
  # ssl_config_credential: kafka-central-cert   # secret holding the truststore
  # truststore_filename: truststore.p12         # key in that secret, mounted at /etc/secret
  # truststore_password:                        # rendered as a secretKeyRef env var
  #   secretName: scp-kafka-ssl-secrets
  #   key: truststore_password
  # jaas_config_credential: team-stream-jaas    # PLAIN/SCRAM jaas.conf, mounted at /etc/secret/kafka
  # kafka_token_enabled: true                   # projected SA token (audience: kafka)

autoscaler:
  enabled: false
  type: keda
  keda:
    fallback: {}
    triggers: []
    annotations: {}
    hpa: 
      scaleUp: 
        policies: []
        stabilizationWindowSeconds: 60
      scaleDown: 
        policies: []
        stabilizationWindowSeconds: 300